<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --encre:#1a1a1a; --encre2:#3d3d3d; --gris:#8a8a8a; --gris2:#aaaaaa;
    --grille:#e8e9e8; --bleu:#003399; --vert:#1f7a4d; --or:#c79100;
    --grenat:#a50020; --grisserie:#808080;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff}
  .fig{width:1600px;background:#fff;padding:44px 52px 40px;
       font-family:'SS4',Cambria,serif;color:var(--encre)}
  .titre{font-size:33px;font-weight:600;line-height:1.2;letter-spacing:-.004em;margin-bottom:20px}
  svg{display:block;width:100%;height:auto}
</style>

<div class="fig" id="fig">
  <div class="titre">Résultats des élèves du secondaire sur une échelle harmonisée, 1965-2012</div>
  <svg id="s" viewBox="0 0 1496 900"></svg>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const E=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const T=(s,a)=>{const n=E("text",Object.assign({"font-family":"SS4, serif"},a));n.textContent=s;return n;};
const AXE={stroke:"var(--encre)","stroke-width":1.3};

const DATA=[
 {label:"France",    col:"var(--bleu)",     pts:[[1965,541.3,1],[1975,577.4,0],[1980,594.6,1],[1985,593.1,0],[1990,591.6,0],[1995,590.1,1],[2000,595.3,1],[2003,577.3,0],[2005,565.8,1],[2007,566.7,0],[2009,567.7,1],[2010,567.0,0],[2012,565.6,1]]},
 {label:"Finlande",  col:"var(--vert)",     pts:[[1965,490.5,1],[1970,497.8,0],[1975,505.2,0],[1980,512.7,1],[1985,527.9,0],[1990,543.5,1],[1995,565.1,1],[2000,576.2,1],[2003,574.3,1],[2005,558.0,1],[2007,550.9,0],[2009,543.8,0],[2010,540.3,0],[2012,533.4,1]]},
 {label:"Pays-Bas",  col:"var(--or)",       pts:[[1965,522.8,1],[1970,542.2,1],[1975,562.3,0],[1980,583.1,1],[1985,585.1,0],[1990,587.1,0],[1995,589.0,1],[2000,600.3,1],[2003,597.3,1],[2005,592.0,1],[2007,588.4,0],[2009,584.8,1],[2010,583.8,0],[2012,581.7,1]]},
 {label:"Angleterre",col:"var(--grenat)",   pts:[[1965,607.9,1],[1970,575.5,1],[1975,544.8,0],[1980,515.8,1],[1985,528.5,0],[1990,541.5,0],[1995,554.8,1],[2000,553.3,1],[2003,555.0,1],[2005,563.1,0],[2007,571.4,1],[2009,568.0,0],[2010,566.4,0],[2012,563.1,1]]},
 {label:"États-Unis",col:"var(--grisserie)",pts:[[1965,530.8,1],[1970,524.6,0],[1975,518.6,0],[1980,512.6,1],[1985,524.1,0],[1990,535.9,0],[1995,548.0,1],[2000,559.8,1],[2003,561.4,1],[2005,563.6,0],[2007,565.8,1],[2009,576.2,1],[2010,573.8,0],[2012,569.0,1]]}
];

(function(){
  const s=document.getElementById("s"), W=1496;
  const L=104,R=262,T0=58,B=812;
  const X0=1965,X1=2012, Y0=615,Y1=482;
  const px=v=>L+(v-X0)/(X1-X0)*(W-L-R);
  const py=v=>T0+(Y0-v)/(Y0-Y1)*(B-T0);

  [500,525,550,575,600].forEach(v=>{
    s.appendChild(E("line",{x1:L,x2:W-R,y1:py(v),y2:py(v),stroke:"var(--grille)","stroke-width":1}));
    s.appendChild(E("line",Object.assign({x1:L-9,x2:L,y1:py(v),y2:py(v)},AXE)));
    s.appendChild(T(String(v),{x:L-19,y:py(v)+9,"text-anchor":"end",fill:"var(--encre2)","font-size":25}));
  });
  s.appendChild(E("line",Object.assign({x1:L,x2:L,y1:T0,y2:B},AXE)));
  s.appendChild(E("line",Object.assign({x1:L,x2:W-R,y1:B,y2:B},AXE)));
  [1970,1980,1990,2000,2010].forEach(v=>{
    s.appendChild(E("line",Object.assign({x1:px(v),x2:px(v),y1:B,y2:B+9},AXE)));
    s.appendChild(T(String(v),{x:px(v),y:B+42,"text-anchor":"middle",fill:"var(--encre2)","font-size":25}));
  });

  // on ne relie que les mesures : les points interpoles sont par construction
  // alignes entre elles, donc la forme est identique. Les intervalles de plus
  // de six ans sans mesure sont en pointilles.
  DATA.forEach(d=>{
    const m=d.pts.filter(q=>q[2]);
    for(let i=1;i<m.length;i++){
      const a=m[i-1], b=m[i], trou=b[0]-a[0]>6;
      s.appendChild(E("line",Object.assign(
        {x1:px(a[0]),y1:py(a[1]),x2:px(b[0]),y2:py(b[1]),
         stroke:d.col,"stroke-width":trou?2.0:2.8,"stroke-linecap":"round"},
        trou?{"stroke-dasharray":"2 7"}:{})));
    }
    m.forEach(q=>s.appendChild(E("circle",{cx:px(q[0]),cy:py(q[1]),r:5.4,fill:d.col})));
  });

  // etiquettes a droite, ecartees pour ne pas se chevaucher
  const lab=DATA.map(d=>{const mm=d.pts.filter(q=>q[2]); const last=mm[mm.length-1];
    return {t:d.label,col:d.col,y0:py(last[1]),y:py(last[1]),x:px(last[0])};});
  lab.sort((a,b)=>a.y-b.y);
  const GAP=36;
  for(let i=1;i<lab.length;i++) if(lab[i].y-lab[i-1].y<GAP) lab[i].y=lab[i-1].y+GAP;
  lab.forEach(o=>{
    if(Math.abs(o.y-o.y0)>6)
      s.appendChild(E("line",{x1:o.x+8,x2:o.x+26,y1:o.y0,y2:o.y-7,
                              stroke:o.col,"stroke-width":1.2,opacity:.55}));
    s.appendChild(T(o.t,{x:o.x+32,y:o.y,fill:o.col,"font-size":26,"font-weight":600}));
  });

  s.appendChild(T("pointillés : plus de six ans sans aucune mesure",
    {x:L+8,y:B-16,fill:"var(--gris)","font-size":21}));
})();
</script>
